<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>KL Next</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#06060b;--card:#0c0c17;--card-h:#11111f;
      --border:#171724;--border2:#20203a;
      --text:#eaeaf5;--muted:#40405a;--muted2:#60607a;
      --yellow:#ffd600;--green:#00c98a;--red:#e8002d;
      --blue:#3b9eff;--purple:#a78bfa;--teal:#2dd4bf;--orange:#fb923c;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{height:100%}
    body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none}

    /* ambient orbs */
    .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.07;animation:drift 18s ease-in-out infinite}
    .orb1{width:400px;height:400px;background:var(--blue);top:-100px;left:-100px;animation-delay:0s}
    .orb2{width:350px;height:350px;background:var(--purple);bottom:-80px;right:-80px;animation-delay:-7s}
    .orb3{width:250px;height:250px;background:var(--teal);top:40%;left:30%;animation-delay:-13s}
    @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.05)}66%{transform:translate(-20px,30px) scale(.95)}}

    /* rail lines */
    .rails{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .rl{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--border) 30%,var(--border) 70%,transparent);opacity:.5}
    .rl:nth-child(1){left:25%}.rl:nth-child(2){left:50%}.rl:nth-child(3){left:75%}
    .td{position:absolute;left:-1px;width:3px;height:22px;border-radius:2px;opacity:0;animation:trainfall 12s linear infinite}
    .rl:nth-child(1) .td{background:var(--blue);animation-delay:0s}
    .rl:nth-child(2) .td{background:var(--purple);animation-delay:-5s}
    .rl:nth-child(3) .td{background:var(--teal);animation-delay:-9s}
    @keyframes trainfall{0%{top:-30px;opacity:0}3%{opacity:.5}97%{opacity:.5}100%{top:100vh;opacity:0}}

    /* page */
    .page{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}

    /* top bar */
    .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 0;margin-bottom:14px}
    .bar-l{display:flex;align-items:center;gap:10px}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:.92rem;background:var(--red);color:#fff;padding:.2rem .58rem;border-radius:5px;letter-spacing:.02em}
    #clk{font-size:.78rem;color:var(--muted2);letter-spacing:.05em;font-variant-numeric:tabular-nums}
    #daystr{font-size:.65rem;color:var(--muted);letter-spacing:.04em}
    .rfbtn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--border2);color:var(--muted2);font-family:'Space Mono',monospace;font-size:.68rem;padding:.3rem .65rem;border-radius:7px;cursor:pointer;transition:all .15s}
    .rfbtn:hover{border-color:var(--muted2);color:var(--text)}
    .rfbtn:active{transform:scale(.95)}
    .spin{animation:rot .6s linear infinite;display:inline-block}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* responsive grid */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:520px){.grid{grid-template-columns:1fr}}

    /* card */
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden;cursor:pointer;transition:transform .18s ease,border-color .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
    .card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 8px 30px rgba(0,0,0,.4)}
    .card:active{transform:scale(.98)}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:16px 16px 0 0}
    .card.train::before{background:linear-gradient(90deg,var(--blue),var(--purple))}
    .card.bus::before{background:linear-gradient(90deg,var(--teal),var(--orange))}
    .card.urgent{border-color:rgba(232,0,45,.3);animation:urgentPulse 2s ease infinite}
    @keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,0,45,.15)}50%{box-shadow:0 0 0 6px rgba(232,0,45,0)}}

    /* route label */
    .route{font-size:.58rem;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:5px;margin-bottom:8px}
    .rfr{color:var(--text);font-weight:700;font-size:.62rem}
    .rto{color:var(--yellow);font-weight:700;font-size:.62rem}

    /* time picker */
    .picker{display:flex;align-items:center;gap:5px;margin-bottom:10px}
    .tpick{background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--text);font-family:'Space Mono',monospace;font-size:.68rem;padding:.28rem .5rem;border-radius:7px;outline:none;flex:1;min-width:0;transition:border-color .15s}
    .tpick:focus{border-color:var(--blue);background:rgba(59,158,255,.06)}
    .tpick::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.3);cursor:pointer;width:11px}
    .nowbtn{background:none;border:1px solid var(--border2);color:var(--muted2);font-family:'Space Mono',monospace;font-size:.58rem;padding:.24rem .48rem;border-radius:6px;cursor:pointer;transition:all .13s;flex-shrink:0;white-space:nowrap}
    .nowbtn:hover{border-color:var(--yellow);color:var(--yellow)}

    /* dep + countdown */
    .dep-wrap{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    .dep{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1;color:var(--text);letter-spacing:-.025em;transition:color .3s}
    .dep.soon{color:var(--red)}
    .cdpill{display:inline-flex;align-items:center;background:rgba(255,214,0,.09);border:1px solid rgba(255,214,0,.2);color:var(--yellow);font-family:'Syne',sans-serif;font-weight:700;font-size:.68rem;padding:.18rem .5rem;border-radius:20px;transition:all .3s;white-space:nowrap;flex-shrink:0}
    .cdpill.soon{background:rgba(232,0,45,.1);border-color:rgba(232,0,45,.3);color:#ff6a80;animation:breathe 1s ease infinite}
    .cdpill.gone{background:none;border-color:var(--border2);color:var(--muted);font-family:'Space Mono',monospace;font-weight:400;animation:none;font-size:.62rem}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}

    /* progress bar */
    .progbar{height:2px;background:var(--border2);border-radius:2px;margin-bottom:8px;overflow:hidden}
    .progfill{height:100%;border-radius:2px;transition:width .9s linear,background .5s;background:var(--green);width:0%}

    /* meta */
    .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .chip{font-size:.7rem;font-weight:700;padding:.1rem .42rem;border-radius:4px;white-space:nowrap;transition:transform .1s}
    .chip:hover{transform:scale(1.07)}
    .cs1{background:rgba(167,139,250,.18);color:#c4b5fd;border:1px solid rgba(167,139,250,.28)}
    .crb{background:rgba(232,0,45,.15);color:#ff6a80;border:1px solid rgba(232,0,45,.22)}
    .c104{background:rgba(45,212,191,.15);color:#5eead4;border:1px solid rgba(45,212,191,.22)}
    .c117{background:rgba(251,146,60,.15);color:#fdba74;border:1px solid rgba(251,146,60,.22)}
    .c136{background:rgba(251,191,36,.15);color:#fcd34d;border:1px solid rgba(251,191,36,.22)}
    .gl{font-size:.62rem;color:var(--muted2)}
    .stoptag{font-size:.66rem;font-weight:700;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--border2);padding:.09rem .4rem;border-radius:4px;white-space:nowrap}
    .walktag{font-size:.58rem;color:var(--teal)}

    /* divider */
    .div{height:1px;background:var(--border);margin:0 -14px 8px;flex-shrink:0}

    /* after */
    .after-label{font-size:.52rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
    .after-list{display:flex;flex-direction:column;gap:4px}
    .after-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.025);border:1px solid var(--border);transition:background .15s,transform .15s;cursor:pointer}
    .after-item:hover{background:rgba(255,255,255,.05);transform:translateX(3px)}
    .after-time{font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;color:var(--muted2);min-width:38px}
    .after-in{font-size:.58rem;color:var(--muted);margin-left:auto;flex-shrink:0}

    /* flip anim */
    @keyframes flipIn{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
    .flip{animation:flipIn .28s ease forwards}

    /* ripple */
    .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);transform:scale(0);animation:rippleOut .5s ease-out forwards;pointer-events:none;z-index:10}
    @keyframes rippleOut{to{transform:scale(4);opacity:0}}

    .noconn{font-size:.68rem;color:var(--muted);padding:2px 0}
    .footer{text-align:center;font-size:.56rem;color:var(--muted);padding:16px 0 4px;letter-spacing:.04em}

    @media(max-width:360px){.dep{font-size:1.6rem}.card{padding:12px 12px 10px}}
  </style>
</head>

const B136H_WD=[[5,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[6,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[7,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[8,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[9,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[10,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[11,20,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[12,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[13,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[14,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[15,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[16,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[17,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[18,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[19,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[20,10,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15']];
const B136H_SA=[[7,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[9,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[11,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[13,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[15,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[17,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15'],[19,30,'136','c136',13,'KL Hbf','→ 2 Min zu OSR 15']];
const B117O_WD=gb(6,17,30,32,'117','c117',3,'Hst: Oskar-Schlemmer-Ring','');
const B117O_SA=gb(7,17,30,28,'117','c117',3,'Hst: Oskar-Schlemmer-Ring','');
const B117O_SO=gb(8,17,60,13,'117','c117',3,'Hst: Oskar-Schlemmer-Ring','');
const B104D_WD=gb(6,8,30,32,'104','c104',9,'Donnersbergstr.','3 Min Fußweg');
const B104D_SA=gb(7,8,30,28,'104','c104',9,'Donnersbergstr.','3 Min Fußweg');
const B104D_SO=gb(8,8,60,13,'104','c104',9,'Donnersbergstr.','3 Min Fußweg');

const DAYS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const sel=(d,wd,sa,so)=>d===0?so:d===6?sa:wd;
const fmtT=d=>d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const p2=n=>String(n).padStart(2,'0');

function buildList(base,tt){
  const r=[];
  for(let off=0;off<=1;off++){
    const d=new Date(base);d.setDate(d.getDate()+off);d.setHours(0,0,0,0);
    for(const row of tt){const[dH,dM,...rest]=row;const dep=new Date(d);dep.setHours(dH,dM,0,0);r.push({dep,rest});}
  }
  return r.sort((a,b)=>a.dep-b.dep);
}

function getFrom(idx){
  const v=document.getElementById('tp'+idx).value;
  const now=new Date();
  if(!v)return now;
  const[h,m]=v.split(':').map(Number);
  const d=new Date(now);d.setHours(h,m,0,0);
  return d;
}

function nextAfter(ft,tt,dow){return buildList(ft,sel(dow,tt[0],tt[1],tt[2])).filter(j=>j.dep>ft);}

function bestBus(ft,dow,opts){
  const c=[];
  for(const o of opts){c.push(...buildList(ft,sel(dow,o.wd,o.sa,o.so||[])).filter(j=>j.dep>ft).slice(0,4));}
  return c.sort((a,b)=>a.dep-b.dep);
}

let cdTimer=null;
const cdFns=[null,null,null,null];
const pbData=[null,null,null,null];

// clock
setInterval(()=>document.getElementById('clk').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),1000);
(()=>document.getElementById('clk').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'}))();

function setNow(i){
  const n=new Date();
  document.getElementById('tp'+i).value=`${p2(n.getHours())}:${p2(n.getMinutes())}`;
  renderCard(i);
}

function initAll(){
  for(let i=0;i<4;i++)setNow(i);
  document.getElementById('daystr').textContent=DAYS[new Date().getDay()];
}

function doRipple(e,idx){
  const card=document.getElementById('c'+idx);
  const r=document.createElement('div');
  r.className='ripple';
  const rect=card.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  card.appendChild(r);
  setTimeout(()=>r.remove(),500);
}

function renderCard(idx){
  const now=new Date();
  const ft=getFrom(idx);
  const dow=ft.getDay();
  let journeys=[];
  if(idx===0) journeys=nextAfter(ft,[TA_WD,TA_SA,TA_SO],dow);
  else if(idx===1) journeys=nextAfter(ft,[TB_WD,TB_SA,TB_SO],dow);
  else if(idx===2) journeys=bestBus(ft,dow,[{wd:B117H_WD,sa:B117H_SA,so:B117H_SO},{wd:B104S_WD,sa:B104S_SA,so:B104S_SO},{wd:B136H_WD,sa:B136H_SA,so:[]}]);
  else journeys=bestBus(ft,dow,[{wd:B117O_WD,sa:B117O_SA,so:B117O_SO},{wd:B104D_WD,sa:B104D_SA,so:B104D_SO}]);

  const depEl=document.getElementById('d'+idx);
  const cdEl=document.getElementById('cd'+idx);
  const metaEl=document.getElementById('m'+idx);
  const afEl=document.getElementById('af'+idx);
  const pbEl=document.getElementById('pb'+idx);
  const card=document.getElementById('c'+idx);

  if(!journeys.length){
    depEl.textContent='—';depEl.className='dep';
    cdEl.textContent='Kein Betrieb';cdEl.className='cdpill gone';
    metaEl.innerHTML='';
    afEl.innerHTML='<span class="noconn">Kein Betrieb</span>';
    pbEl.style.width='0%';card.classList.remove('urgent');
    cdFns[idx]=null;pbData[idx]=null;return;
  }

  const j=journeys[0];
  let ln,ch,gl='—',from='',walk='';
  if(idx<2){[,ln,ch,gl]=j.rest;}
  else{[ln,ch,,from,walk]=j.rest;}

  // flip animation on dep
  depEl.classList.remove('flip');void depEl.offsetWidth;depEl.classList.add('flip');
  depEl.textContent=fmtT(j.dep);

  // meta
  let mh=`<span class="chip ${ch}">${ln}</span>`;
  if(gl&&gl!=='—') mh+=`<span class="gl">Gl.&thinsp;${gl}</span>`;
  if(from) mh+=`<span class="stoptag">📍 ${from}</span>`;
  if(walk) mh+=`<span class="walktag">🚶 ${walk}</span>`;
  metaEl.innerHTML=mh;

  // progress bar prev departure
  const prev=journeys[1]?new Date(j.dep.getTime()-Math.abs(journeys[1].dep-j.dep)):new Date(j.dep.getTime()-30*60000);
  pbData[idx]={dep:j.dep,prevDep:prev};

  // after list
  const next2=journeys.slice(1,3);
  afEl.innerHTML=!next2.length?'<span class="noconn">—</span>':next2.map(jj=>{
    const ln2=idx<2?jj.rest[1]:jj.rest[0];
    const ch2=idx<2?jj.rest[2]:jj.rest[1];
    const fr2=idx>=2?(jj.rest[3]||''):'';
    const ms=Math.round((jj.dep-now)/60000);
    const inStr=ms>0?(ms<60?`${ms}m`:`${Math.floor(ms/60)}h${p2(ms%60)}m`):'abg.';
    return `<div class="after-item">
      <span class="after-time">${fmtT(jj.dep)}</span>
      <span class="chip ${ch2}" style="font-size:.6rem;padding:.07rem .35rem">${ln2}</span>
      ${fr2?`<span style="font-size:.57rem;color:var(--muted2)">${fr2}</span>`:''}
      <span class="after-in">${inStr}</span>
    </div>`;
  }).join('');

  // live countdown + urgency + progress
  cdFns[idx]=()=>{
    const ms=j.dep-new Date();
    const c=document.getElementById('c'+idx);
    const de=document.getElementById('d'+idx);
    const ce=document.getElementById('cd'+idx);
    const pe=document.getElementById('pb'+idx);
    if(ms<=0){
      ce.textContent='Jetzt!';ce.className='cdpill soon';
      de.className='dep soon';c.classList.add('urgent');
      pe.style.width='100%';pe.style.background='var(--red)';return;
    }
    const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);
    ce.textContent=m>0?(m<60?`in ${m}m ${s}s`:`in ${Math.floor(m/60)}h ${m%60}m`):`${s}s`;
    if(m<5){ce.className='cdpill soon';de.className='dep soon';c.classList.add('urgent');}
    else{ce.className='cdpill';de.className='dep';c.classList.remove('urgent');}
    if(pbData[idx]){
      const{dep,prevDep}=pbData[idx];
      const total=dep-prevDep;
      const pct=Math.min(100,Math.max(0,((new Date()-prevDep)/total)*100));
      pe.style.width=pct+'%';
      pe.style.background=pct<70?'var(--green)':pct<90?'var(--yellow)':'var(--red)';
    }
  };
  cdFns[idx]();
}

function refreshAll(){
  const ic=document.getElementById('rfic');
  ic.classList.add('spin');setTimeout(()=>ic.classList.remove('spin'),500);
  document.getElementById('daystr').textContent=DAYS[new Date().getDay()];
  for(let i=0;i<4;i++)renderCard(i);
}

if(cdTimer)clearInterval(cdTimer);
cdTimer=setInterval(()=>cdFns.forEach(f=>f&&f()),1000);
setInterval(refreshAll,30000);
initAll();
</script>
