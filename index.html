<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>KL Next</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#07070c; --card:#0d0d18; --card2:#131322;
      --border:#191926; --border2:#22223a;
      --text:#eaeaf5; --muted:#484862; --muted2:#666680;
      --yellow:#ffd600; --green:#00c98a; --red:#e8002d;
      --blue:#3b9eff; --purple:#a78bfa; --teal:#2dd4bf; --orange:#fb923c;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{
      background:var(--bg); color:var(--text);
      font-family:'Space Mono',monospace;
      display:flex; flex-direction:column;
      -webkit-text-size-adjust:100%;
    }

    /* ── Top bar ───────────────────────────────────────── */
    .bar{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px 0; flex-shrink:0;
    }
    .bar-l{display:flex;align-items:center;gap:10px}
    .logo{
      font-family:'Syne',sans-serif;font-weight:800;font-size:.88rem;
      background:var(--red);color:#fff;padding:.18rem .52rem;border-radius:4px;
    }
    #clk{font-size:.72rem;color:var(--muted2);letter-spacing:.04em}
    #daystr{font-size:.65rem;color:var(--muted);letter-spacing:.03em}
    .bar-r{display:flex;align-items:center;gap:8px}
    .icon-btn{
      background:none;border:1px solid var(--border2);color:var(--muted2);
      font-size:.7rem;padding:.28rem .58rem;border-radius:6px;cursor:pointer;
      font-family:'Space Mono',monospace;transition:all .14s;
    }
    .icon-btn:hover{border-color:var(--muted2);color:var(--text)}
    .icon-btn:active{transform:scale(.95)}
    .spin{animation:rot .6s linear infinite;display:inline-block}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* ── 2×2 grid ──────────────────────────────────────── */
    .grid{
      flex:1; display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:1fr 1fr;
      gap:8px; padding:10px 8px calc(8px + env(safe-area-inset-bottom));
      min-height:0;
    }

    /* ── Card ──────────────────────────────────────────── */
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      display:flex; flex-direction:column;
      padding:12px 12px 10px;
      gap:0; overflow:hidden; position:relative;
      min-height:0;
    }
    .card::after{
      content:''; position:absolute;
      top:0;left:0;right:0;height:2px;border-radius:14px 14px 0 0;
    }
    .card.train::after{background:linear-gradient(90deg,var(--blue),var(--purple))}
    .card.bus::after{background:linear-gradient(90deg,var(--teal),var(--orange))}

    /* Route header */
    .route{
      font-size:.58rem;color:var(--muted2);
      letter-spacing:.05em;text-transform:uppercase;
      display:flex;align-items:center;gap:4px;flex-wrap:wrap;
      margin-bottom:6px; line-height:1.3;
    }
    .rfr{color:var(--text);font-weight:700;font-size:.6rem}
    .rto{color:var(--yellow);font-weight:700;font-size:.6rem}

    /* ── Time picker row ────────────────────────────────── */
    .picker-row{
      display:flex;align-items:center;gap:5px;
      margin-bottom:8px;
    }
    .time-pick{
      background:var(--card2);border:1px solid var(--border2);
      color:var(--text);font-family:'Space Mono',monospace;
      font-size:.65rem;padding:.25rem .45rem;border-radius:6px;
      outline:none;flex:1;min-width:0;
    }
    .time-pick:focus{border-color:var(--blue)}
    .time-pick::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.35);cursor:pointer;width:12px}
    .now-btn{
      background:none;border:1px solid var(--border2);color:var(--muted2);
      font-family:'Space Mono',monospace;font-size:.58rem;
      padding:.22rem .45rem;border-radius:5px;cursor:pointer;
      white-space:nowrap;transition:all .13s;flex-shrink:0;
    }
    .now-btn:hover{border-color:var(--muted2);color:var(--text)}

    /* ── Primary connection ─────────────────────────────── */
    .primary{
      display:flex; align-items:center; gap:10px;
      margin-bottom:7px;
    }
    .big-dep{
      font-family:'Syne',sans-serif;font-weight:800;
      font-size:clamp(1.6rem,4vw,2.2rem);line-height:1;
      color:var(--text);letter-spacing:-.02em;
      flex-shrink:0;
    }

    .cd-pill{
      display:inline-flex;align-items:center;gap:3px;
      background:rgba(255,214,0,.08);border:1px solid rgba(255,214,0,.18);
      color:var(--yellow);font-family:'Syne',sans-serif;font-weight:700;
      font-size:.65rem;padding:.15rem .45rem;border-radius:20px;
      width:fit-content;white-space:nowrap;
    }
    .cd-pill.soon{
      background:rgba(232,0,45,.1);border-color:rgba(232,0,45,.25);color:#ff6a80;
      animation:breathe 1s ease infinite;
    }
    .cd-pill.gone{background:none;border-color:var(--border2);color:var(--muted);font-family:'Space Mono',monospace;font-weight:400}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.6}}

    /* Line chip + stop info */
    .meta{
      display:flex;align-items:center;gap:6px;flex-wrap:wrap;
      margin-bottom:7px;
    }
    .chip{font-size:.72rem;font-weight:700;padding:.12rem .45rem;border-radius:4px;white-space:nowrap}
    .cs1{background:rgba(167,139,250,.18);color:#c4b5fd;border:1px solid rgba(167,139,250,.28)}
    .crb{background:rgba(232,0,45,.15);color:#ff6a80;border:1px solid rgba(232,0,45,.22)}
    .c104{background:rgba(45,212,191,.15);color:#5eead4;border:1px solid rgba(45,212,191,.22)}
    .c117{background:rgba(251,146,60,.15);color:#fdba74;border:1px solid rgba(251,146,60,.22)}
    .c136{background:rgba(251,191,36,.15);color:#fcd34d;border:1px solid rgba(251,191,36,.22)}
    .gl{font-size:.68rem;color:var(--muted2)}
    .stop-tag{
      font-size:.68rem;color:var(--text);font-weight:700;
      background:rgba(255,255,255,.07);padding:.1rem .42rem;
      border-radius:4px;white-space:nowrap;
      border:1px solid var(--border2);
    }
    .walk-tag{
      font-size:.6rem;color:var(--teal);white-space:nowrap;
    }

    /* ── Divider ────────────────────────────────────────── */
    .divider{
      height:1px;background:var(--border);margin:0 -12px 6px;flex-shrink:0;
    }

    /* ── Next-after row ─────────────────────────────────── */
    .next-label{
      font-size:.53rem;text-transform:uppercase;letter-spacing:.07em;
      color:var(--muted);margin-bottom:4px;
    }
    .after-row{
      display:flex;flex-direction:column;gap:4px;
    }
    .after-dep{
      font-family:'Syne',sans-serif;font-weight:700;
      font-size:.88rem;color:var(--muted2);
      margin-right:5px;
    }
    .after-in{font-size:.6rem;color:var(--muted);margin-left:3px}

    /* No service */
    .noconn{
      font-size:.7rem;color:var(--muted);padding:4px 0;
      font-style:italic;
    }

    @media(max-width:360px){
      .big-dep{font-size:1.45rem}
      .grid{gap:6px;padding:8px 6px calc(6px + env(safe-area-inset-bottom))}
      .card{padding:10px 10px 8px}
    }
    @media(max-height:600px){
      .big-dep{font-size:1.5rem}
      .card{padding:9px 10px 7px}
    }
  </style>
</head>

// ── Bus-Fahrpläne ──────────────────────────────────────────
// Erzeuge Taktfahrplan: [H, M, linie, chip, dur, fromStop, walkInfo]
function mkB(startH,startM,interval,count,ln,ch,dur,from,walk){
  const r=[];let t=startH*60+startM;
  for(let i=0;i<n;i++){
    r.push([Math.floor(t/60)%24, t%60, ln, ch, dur, from, walk]);
    t+=interval;
  }
  return r;
}
// Inline da globale Variable n nicht definiert — direkte Arrays:
function genBus(h,m,iv,n,ln,ch,dur,from,walk){
  const r=[];let t=h*60+m;
  for(let i=0;i<n;i++){r.push([Math.floor(t/60)%24,t%60,ln,ch,dur,from,walk]);t+=iv;}
  return r;
}

// ── KARTE 3: OSR 15 → ─────────────────────────────────────
// 117 ab Hst Oskar-Schlemmer-Ring → KL Hbf (3 Min, kein Fußweg nötig)
// 117 hält an OSR auf dem Hinweg (Richtung PRE-Park/Hbf zurück).
// Auf dem Rückweg (Richtung Stadtmitte) hält 117 NICHT an OSR.
// Also: 117 fährt von PRE-Park zurück über OSR Richtung Stadtmitte.
// Abfahrt OSR Richtung Stadtmitte: ~Hbf-Abfahrt + 7 Min = :17 / :47
const B117O_WD = genBus(6,17,30,32,'117','c117',3,'Hst: Oskar-Schlemmer-Ring','');
const B117O_SA = genBus(7,17,30,28,'117','c117',3,'Hst: Oskar-Schlemmer-Ring','');

// 104 ab Donnersbergstr → Stadtmitte (9 Min)
// Donnersbergstr ist 3 Min Fußweg von OSR 15
// 104 fährt von Donnersbergstr ca. :08 / :38 (= Stadtmitte-Abfahrt :00/:30 + 8 Min)
const B104D_WD = genBus(6,8,30,32,'104','c104',9,'Donnersbergstr.','3 Min Fußweg');
const B104D_SA = genBus(7,8,30,28,'104','c104',9,'Donnersbergstr.','3 Min Fußweg');
const B104D_SO = genBus(8,8,60,13,'104','c104',9,'Donnersbergstr.','3 Min Fußweg');

// ── Hilfs-Funktionen ──────────────────────────────────────
const DAYS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function sel(d,wd,sa,so){return d===0?so:d===6?sa:wd;}
function fmtT(d){return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}
function p2(n){return String(n).padStart(2,'0');}

// Baue Abfahrtsliste aus gegebenem Basiszeit-Objekt (Date mit h:m gesetzt)
function buildList(base, tt) {
  const r = [];
  // Prüfe heutigen und morgigen Tag
  for (let off=0; off<=1; off++) {
    const d = new Date(base); d.setDate(d.getDate()+off); d.setHours(0,0,0,0);
    for (const row of tt) {
      const [dH,dM,...rest] = row;
      const dep = new Date(d); dep.setHours(dH,dM,0,0);
      r.push({dep, rest});
    }
  }
  return r.sort((a,b)=>a.dep-b.dep);
}

function getFromTime(cardIdx) {
  const v = document.getElementById('tp'+cardIdx).value;
  const now = new Date();
  if (!v) return now;
  const [h,m] = v.split(':').map(Number);
  const d = new Date(now); d.setHours(h,m,0,0);
  // Falls Zeit in der Vergangenheit liegt → gleiche Zeit morgen? Nein → trotzdem heute zeigen
  return d;
}

// Nächste Abfahrt nach fromTime
function nextAfter(fromTime, tt, dow) {
  const list = buildList(fromTime, sel(dow,tt[0],tt[1],tt[2]));
  return list.filter(j=>j.dep>fromTime);
}

// Für Karten 2+3: Beste Option (früheste Abfahrtszeit)
function bestBus(fromTime, dow, options) {
  // options: [{wd,sa,so}]
  const cands = [];
  for (const opt of options) {
    const tt = sel(dow, opt.wd, opt.sa, opt.so||[]);
    const list = buildList(fromTime, tt).filter(j=>j.dep>fromTime);
    if (list.length > 0) cands.push(...list.slice(0,3));
  }
  cands.sort((a,b)=>a.dep-b.dep);
  return cands;
}

// ── State ─────────────────────────────────────────────────
let cdTimer = null;
const cdFns = [null,null,null,null];

// ── Clock ─────────────────────────────────────────────────
setInterval(()=>{
  document.getElementById('clk').textContent =
    new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
},1000);
(()=>document.getElementById('clk').textContent =
  new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'}))();

// ── Init pickers ──────────────────────────────────────────
function setNow(i){
  const n=new Date();
  document.getElementById('tp'+i).value=`${p2(n.getHours())}:${p2(n.getMinutes())}`;
  renderCard(i);
}
function initAll(){
  for(let i=0;i<4;i++) setNow(i);
  const n=new Date();
  document.getElementById('daystr').textContent=DAYS[n.getDay()];
}

// ── Render a single card ──────────────────────────────────
function renderCard(idx) {
  const now = new Date();
  const fromTime = getFromTime(idx);
  const dow = fromTime.getDay();

  let journeys = [];

  if (idx === 0) {
    journeys = nextAfter(fromTime, [T_A_WD,T_A_SA,T_A_SO], dow);
  } else if (idx === 1) {
    journeys = nextAfter(fromTime, [T_B_WD,T_B_SA,T_B_SO], dow);
  } else if (idx === 2) {
    journeys = bestBus(fromTime, dow, [
      {wd:B117H_WD, sa:B117H_SA, so:B117H_SO},
      {wd:B104S_WD, sa:B104S_SA, so:B104S_SO},
      {wd:B136H_WD, sa:B136H_SA, so:[]},
    ]);
  } else {
    journeys = bestBus(fromTime, dow, [
      {wd:B117O_WD, sa:B117O_SA, so:B117O_SO},
      {wd:B104D_WD, sa:B104D_SA, so:B104D_SO},
    ]);
  }

  const depEl  = document.getElementById('d'+idx);
  const cdEl   = document.getElementById('cd'+idx);
  const metaEl = document.getElementById('m'+idx);
  const afEl   = document.getElementById('af'+idx);

  if (!journeys.length) {
    depEl.textContent='—';
    cdEl.textContent='Kein Betrieb';
    cdEl.className='cd-pill gone';
    metaEl.innerHTML='';
    afEl.innerHTML='<span style="font-size:.58rem;color:var(--muted)">—</span>';
    cdFns[idx]=null;
    return;
  }

  const j = journeys[0];
  // Train rest: [dur, ln, ch, gl]
  // Bus rest:   [ln, ch, dur, from, walk]  (from buildList spread)
  let ln, ch, gl='—', from='', walk='';
  if (idx < 2) {
    [, ln, ch, gl] = j.rest; // rest[0]=dur, rest[1]=ln, rest[2]=ch, rest[3]=gl
  } else {
    [ln, ch, , from, walk] = j.rest; // rest[0]=ln, rest[1]=ch, rest[2]=dur, rest[3]=from, rest[4]=walk
  }

  depEl.textContent = fmtT(j.dep);

  // chip + stop + walk — build meta
  let metaHTML = `<span class="chip ${ch}">${ln}</span>`;
  if (gl && gl!=='—') metaHTML += `<span class="gl">Gl.&thinsp;${gl}</span>`;
  if (from) metaHTML += `<span class="stop-tag">📍 ${from}</span>`;
  if (walk) metaHTML += `<br/><span class="walk-tag">🚶 ${walk}</span>`;
  metaEl.innerHTML = metaHTML;

  // countdown function
  cdFns[idx] = () => {
    const ms = j.dep - new Date();
    if (ms <= 0) {
      cdEl.textContent = 'Jetzt!';
      cdEl.className = 'cd-pill soon';
      return;
    }
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
    if (m < 3) {
      cdEl.textContent = m>0 ? `${m}m ${s}s` : `${s}s`;
      cdEl.className = 'cd-pill soon';
    } else if (m < 60) {
      cdEl.textContent = `in ${m} min`;
      cdEl.className = 'cd-pill';
    } else {
      cdEl.textContent = `in ${Math.floor(m/60)}h ${m%60}m`;
      cdEl.className = 'cd-pill';
    }
  };
  cdFns[idx]();

  // "Danach" — next 2 connections
  const next2 = journeys.slice(1,3);
  if (!next2.length) {
    afEl.innerHTML='<span style="font-size:.58rem;color:var(--muted)">—</span>';
  } else {
    afEl.innerHTML = next2.map(jj => {
      let ln2, ch2, from2='';
      if (idx < 2) {
        ln2   = jj.rest[1]; // train: rest=[dur,ln,ch,gl]
        ch2   = jj.rest[2];
      } else {
        ln2   = jj.rest[0]; // bus: rest=[ln,ch,dur,from,walk]
        ch2   = jj.rest[1];
        from2 = jj.rest[3] || '';
      }
      const msUntil = Math.round((jj.dep - now) / 60000);
      const inStr = msUntil>0
        ? (msUntil<60 ? `${msUntil}m` : `${Math.floor(msUntil/60)}h${p2(msUntil%60)}`)
        : 'abg.';
      let s = `<span class="after-dep">${fmtT(jj.dep)}</span>`+
              `<span class="chip ${ch2}" style="font-size:.58rem;padding:.06rem .35rem">${ln2}</span>`;
      if (from2) s += `<span style="font-size:.58rem;color:var(--muted2)">${from2}</span>`;
      s += `<span class="after-in">${inStr}</span>`;
      return s;
    }).join('<br/>');
  }
}

// ── Global tick (every second) ────────────────────────────
function tick() {
  cdFns.forEach(fn => fn && fn());
}

// ── Refresh all ───────────────────────────────────────────
function refreshAll() {
  const ic = document.getElementById('rfic');
  ic.classList.add('spin');
  setTimeout(()=>ic.classList.remove('spin'), 500);
  document.getElementById('daystr').textContent = DAYS[new Date().getDay()];
  for (let i=0;i<4;i++) renderCard(i);
}

// ── Boot ──────────────────────────────────────────────────
initAll();
if (cdTimer) clearInterval(cdTimer);
cdTimer = setInterval(tick, 1000);
setInterval(refreshAll, 30000);
</script>
