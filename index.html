<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>🚆 KL ↔ Kindsbach</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --red:    #e8002d;
      --yellow: #ffde00;
      --dark:   #09090e;
      --panel:  #101018;
      --card:   #14141e;
      --border: #1e1e2d;
      --text:   #e4e4f0;
      --muted:  #52526a;
      --green:  #00c98a;
      --orange: #ff7c2a;
      --blue:   #3b9eff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--dark); color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh; -webkit-text-size-adjust: 100%;
    }

    /* Rail bg */
    .rail-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .rail { position: absolute; top: 0; bottom: 0; width: 1px;
      background: linear-gradient(to bottom,transparent,var(--border) 25%,var(--border) 75%,transparent);
      opacity: .35; }
    .rail:nth-child(1){left:15%} .rail:nth-child(2){left:40%}
    .rail:nth-child(3){left:65%} .rail:nth-child(4){left:88%}
    .dot { position:absolute; left:-2px; width:5px; height:18px; border-radius:3px;
      opacity:0; animation:run 10s linear infinite; }
    .rail:nth-child(1) .dot{background:var(--red);   animation-delay:0s}
    .rail:nth-child(2) .dot{background:var(--yellow);animation-delay:3.3s}
    .rail:nth-child(3) .dot{background:var(--blue);  animation-delay:6.6s}
    .rail:nth-child(4) .dot{background:var(--green); animation-delay:1.7s}
    @keyframes run{0%{top:-30px;opacity:0}4%{opacity:.65}96%{opacity:.65}100%{top:100vh;opacity:0}}

    /* Page */
    .page { position:relative; z-index:1; max-width:680px; margin:0 auto;
      padding:0 16px calc(40px + env(safe-area-inset-bottom)); }

    /* Header */
    .header { padding:28px 0 18px; }
    .db-badge { display:inline-block; background:var(--red); color:#fff;
      font-family:'Syne',sans-serif; font-weight:800; font-size:.95rem;
      padding:.28rem .65rem; border-radius:5px; margin-bottom:10px; }
    .route-title { font-family:'Syne',sans-serif; font-weight:800;
      font-size:clamp(1.1rem,5vw,1.6rem); line-height:1.2; }
    .kl  { color:var(--yellow) }
    .arr { color:var(--muted); margin:0 .2em }
    .kb  { color:var(--green) }
    .meta { margin-top:7px; font-size:.68rem; color:var(--muted);
      display:flex; gap:14px; flex-wrap:wrap; letter-spacing:.06em; text-transform:uppercase; }
    .pulse::before { content:''; display:inline-block; width:6px; height:6px;
      border-radius:50%; background:var(--green); margin-right:.35em;
      animation:pulse 1.8s ease infinite; vertical-align:middle; }
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,201,138,.5)}50%{box-shadow:0 0 0 6px rgba(0,201,138,0)}}

    /* Controls */
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
    .time-in { background:var(--panel); border:1px solid var(--border); color:var(--text);
      font-family:'Space Mono',monospace; font-size:.75rem;
      padding:.45rem .7rem; border-radius:8px; outline:none;
      flex:1; min-width:140px; max-width:190px; }
    .time-in:focus { border-color:var(--blue) }
    .time-in::-webkit-calendar-picker-indicator { filter:invert(1) opacity(.4); cursor:pointer }
    .btn { display:inline-flex; align-items:center; gap:.3em;
      border-radius:8px; font-family:'Space Mono',monospace; font-size:.73rem;
      padding:.45rem .85rem; cursor:pointer; border:1px solid var(--border);
      background:var(--panel); color:var(--text); transition:all .15s; white-space:nowrap; }
    .btn:active { transform:scale(.97) }
    .btn.primary { background:var(--red); border-color:var(--red); color:#fff }
    .btn.primary:hover { background:#c5002a }
    .btn.ghost:hover { border-color:var(--muted) }
    .spin { animation:rot .7s linear infinite; display:inline-block }
    @keyframes rot{to{transform:rotate(360deg)}}

    /* Status bar */
    .status { border:1px solid var(--border); border-radius:9px;
      padding:10px 14px; margin-bottom:14px; font-size:.72rem;
      display:flex; align-items:center; gap:8px;
      background:var(--panel); color:var(--muted); }
    .status.loading { border-color:var(--blue); color:var(--blue); background:rgba(59,158,255,.06) }
    .status.ok      { border-color:var(--green);color:var(--green);background:rgba(0,201,138,.06) }
    .status.err     { border-color:var(--red);  color:var(--red);  background:rgba(232,0,45,.06) }

    /* Section */
    .section { margin-bottom:26px }
    .sec-head { display:flex; align-items:center; gap:10px;
      padding:11px 14px; border-radius:10px 10px 0 0;
      border:1px solid var(--border); border-bottom:none; background:var(--panel); }
    .sec-head .dir { font-family:'Syne',sans-serif; font-weight:700; font-size:.88rem }
    .sec-head .dir .fr { color:var(--yellow) }
    .sec-head .dir .to { color:var(--green) }
    .sec-head .nbadge { margin-left:auto; font-size:.63rem; color:var(--muted);
      letter-spacing:.05em; text-transform:uppercase }

    /* Card list */
    .cards { border:1px solid var(--border); border-radius:0 0 10px 10px; overflow:hidden }

    /* Connection card */
    .card { background:var(--card); border-bottom:1px solid var(--border);
      cursor:pointer; transition:background .12s; -webkit-tap-highlight-color:transparent; }
    .card:last-child { border-bottom:none }
    .card:hover,.card:focus { background:#1a1a26; outline:none }
    .card.next { border-left:3px solid var(--yellow); background:rgba(255,222,0,.03) }
    .card.cancelled { opacity:.4 }

    /* Card main row */
    .cmain { display:grid; grid-template-columns:68px 1fr 22px;
      align-items:center; gap:10px; padding:13px 14px; }

    /* Left: countdown */
    .ccount { text-align:center }
    .cval { font-family:'Syne',sans-serif; font-weight:800;
      font-size:.92rem; color:var(--yellow); line-height:1 }
    .clabel { font-size:.56rem; color:var(--muted); text-transform:uppercase;
      letter-spacing:.06em; margin-top:2px }
    .cpast { font-size:.72rem; color:var(--muted) }

    /* Middle: times + badges */
    .cmid { display:flex; flex-direction:column; gap:4px; min-width:0 }
    .trow { display:flex; align-items:baseline; gap:7px; flex-wrap:wrap }
    .dep { font-family:'Syne',sans-serif; font-weight:700;
      font-size:1.1rem; line-height:1 }
    .dep.late { color:var(--orange) }
    .orig { font-size:.65rem; color:var(--muted); text-decoration:line-through }
    .arr-t { font-size:.8rem; color:var(--muted) }
    .brow { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:1px }
    .badge { font-size:.63rem; font-weight:700; padding:.1rem .38rem; border-radius:4px }
    .b-ok   { background:rgba(0,201,138,.15); color:var(--green) }
    .b-warn { background:rgba(255,124,42,.15); color:var(--orange) }
    .b-late { background:rgba(232,0,45,.15);   color:var(--red) }
    .chip { font-size:.67rem; font-weight:700; padding:.1rem .42rem;
      border-radius:4px; letter-spacing:.02em }
    .c-rb { background:rgba(232,0,45,.18); color:#ff6a80; border:1px solid rgba(232,0,45,.28) }
    .c-re { background:rgba(255,124,42,.18); color:var(--orange); border:1px solid rgba(255,124,42,.28) }
    .c-s  { background:rgba(59,158,255,.18); color:#70bcff; border:1px solid rgba(59,158,255,.28) }
    .c-x  { background:rgba(255,255,255,.07); color:var(--text); border:1px solid var(--border) }
    .dur { font-size:.65rem; color:var(--muted) }

    /* Right: chevron */
    .chev { color:var(--muted); font-size:.85rem; transition:transform .2s; flex-shrink:0 }
    .card.open .chev { transform:rotate(90deg) }

    /* Detail panel */
    .cdetail { display:none; padding:0 14px 13px;
      border-top:1px solid var(--border); background:rgba(255,255,255,.012) }
    .card.open .cdetail { display:block }
    .det-label { font-size:.6rem; text-transform:uppercase; letter-spacing:.08em;
      color:var(--muted); margin:10px 0 5px }
    .stop-row { display:flex; align-items:center; gap:8px; padding:2px 0; font-size:.72rem }
    .sdot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0 }
    .sdot.org { background:var(--yellow) }
    .sdot.dst { background:var(--green) }
    .sname { color:var(--text) }
    .stime { color:var(--muted); margin-left:auto; font-size:.65rem }
    .rmk { margin-top:8px; padding:6px 10px;
      background:rgba(255,124,42,.07); border-left:2px solid var(--orange);
      border-radius:4px; color:var(--orange); font-size:.68rem; line-height:1.5 }
    .det-op { margin-top:8px; font-size:.63rem; color:var(--muted) }

    /* Empty */
    .empty { padding:22px 14px; text-align:center; color:var(--muted);
      font-size:.72rem; border:1px solid var(--border);
      border-radius:0 0 10px 10px; background:var(--card) }

    footer { text-align:center; font-size:.6rem; color:var(--muted);
      padding:18px 0; border-top:1px solid var(--border); margin-top:4px; line-height:1.9 }

    @media(max-width:380px){
      .dep{font-size:.95rem}
      .cmain{grid-template-columns:58px 1fr 20px; gap:8px; padding:11px 12px}
      .cdetail{padding:0 12px 12px}
    }
  </style>
</head>
<body>

<div class="rail-bg" aria-hidden="true">
  <div class="rail"><div class="dot"></div></div>
  <div class="rail"><div class="dot"></div></div>
  <div class="rail"><div class="dot"></div></div>
  <div class="rail"><div class="dot"></div></div>
</div>

<div class="page">

  <div class="header">
    <div class="db-badge">DB</div>
    <div class="route-title">
      <span class="kl">Kaiserslautern Hbf</span>
      <span class="arr">↔</span>
      <span class="kb">Kindsbach Bahnhof</span>
    </div>
    <div class="meta">
      <span class="pulse" id="liveLabel">Echtzeit</span>
      <span id="clock">—</span>
      <span id="updated">—</span>
    </div>
  </div>

  <div class="controls">
    <input type="datetime-local" id="timeIn" class="time-in"/>
    <button class="btn primary" id="loadBtn" onclick="loadAll()">
      <span id="loadIco">⟳</span> Laden
    </button>
    <button class="btn ghost" onclick="goNow()">Jetzt</button>
  </div>

  <div id="status" class="status loading">
    <span class="spin">⟳</span> Verbindungen werden geladen …
  </div>

  <!-- KL → KB -->
  <div class="section">
    <div class="sec-head">
      <span style="font-size:1rem">🚆</span>
      <div class="dir">
        <span class="fr">Kaiserslautern Hbf</span>
        <span style="color:var(--muted)"> → </span>
        <span class="to">Kindsbach Bf</span>
      </div>
      <span class="nbadge" id="badgeA"></span>
    </div>
    <div class="cards" id="cardsA"><div class="empty">Wird geladen …</div></div>
  </div>

  <!-- KB → KL -->
  <div class="section">
    <div class="sec-head">
      <span style="font-size:1rem">🚆</span>
      <div class="dir">
        <span class="fr">Kindsbach Bf</span>
        <span style="color:var(--muted)"> → </span>
        <span class="to">Kaiserslautern Hbf</span>
      </div>
      <span class="nbadge" id="badgeB"></span>
    </div>
    <div class="cards" id="cardsB"><div class="empty">Wird geladen …</div></div>
  </div>

  <footer>
    Echtzeit-Daten: <strong>v6.db.transport.rest</strong> (DB Navigator API) · Kein offizielles DB-Produkt
  </footer>
</div>

<script>
const API = 'https://v6.db.transport.rest';

// Resolved stop IDs (filled on first load)
let stopKL = null; // Kaiserslautern Hbf
let stopKB = null; // Kindsbach Bahnhof

let cdTimers = [];

/* ── Clock ───────────────────────────────────────── */
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tick,1000); tick();

/* ── Datetime ────────────────────────────────────── */
function goNow() {
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  document.getElementById('timeIn').value =
    `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}T${p(n.getHours())}:${p(n.getMinutes())}`;
}
goNow();

/* ── Status helper ───────────────────────────────── */
function setStatus(type, html) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.innerHTML = html;
  el.style.display = '';
}

/* ── Resolve stop IDs via /locations ─────────────── */
async function resolveStop(query) {
  const url = `${API}/locations?query=${encodeURIComponent(query)}&results=5&stops=true`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`locations ${res.status}`);
  const data = await res.json();
  // Pick first real stop (type=stop), preferring exact name match
  const stops = data.filter(s => s.type === 'stop');
  if (!stops.length) throw new Error(`Kein Halt gefunden für: ${query}`);
  return stops[0];
}

/* ── Fetch journeys for one direction ────────────── */
async function fetchJourneys(fromId, toId, dt, results=9) {
  const url =
    `${API}/journeys` +
    `?from=${fromId}&to=${toId}` +
    `&departure=${encodeURIComponent(dt.toISOString())}` +
    `&results=${results}` +
    `&stopovers=true&remarks=true&language=de`;
  const res = await fetch(url);
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`journeys ${res.status}: ${txt.slice(0,80)}`);
  }
  const data = await res.json();
  return data.journeys || [];
}

/* ── Main load ───────────────────────────────────── */
async function loadAll() {
  const btn  = document.getElementById('loadBtn');
  const ico  = document.getElementById('loadIco');
  btn.disabled = true;
  ico.classList.add('spin');
  setStatus('loading','<span class="spin">⟳</span> Verbindungen werden abgerufen …');
  cdTimers.forEach(clearInterval); cdTimers = [];

  const val = document.getElementById('timeIn').value;
  const dt  = val ? new Date(val) : new Date();

  try {
    // Resolve stop IDs once and cache them
    if (!stopKL) {
      setStatus('loading','<span class="spin">⟳</span> Bahnhöfe werden gesucht …');
      [stopKL, stopKB] = await Promise.all([
        resolveStop('Kaiserslautern Hbf'),
        resolveStop('Kindsbach Bahnhof'),
      ]);
    }

    setStatus('loading','<span class="spin">⟳</span> Fahrplandaten werden geladen …');

    const [journeysA, journeysB] = await Promise.all([
      fetchJourneys(stopKL.id, stopKB.id, dt),
      fetchJourneys(stopKB.id, stopKL.id, dt),
    ]);

    renderJourneys('cardsA', 'badgeA', 'cdA', journeysA, 'Kaiserslautern Hbf', 'Kindsbach');
    renderJourneys('cardsB', 'badgeB', 'cdB', journeysB, 'Kindsbach', 'Kaiserslautern');

    const totalCount = journeysA.length + journeysB.length;
    setStatus('ok', `✓ ${totalCount} Verbindungen geladen · ${stopKL.name} ↔ ${stopKB.name}`);
    document.getElementById('updated').textContent =
      'Stand ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});

  } catch(err) {
    setStatus('err', `✗ Fehler: ${err.message}`);
    console.error(err);
  } finally {
    btn.disabled = false;
    ico.classList.remove('spin');
  }
}

/* ── Render journey list ─────────────────────────── */
function renderJourneys(containerId, badgeId, cdPrefix, journeys, fromName, toName) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';

  if (!journeys.length) {
    el.innerHTML = '<div class="empty">Keine Verbindungen gefunden.</div>';
    document.getElementById(badgeId).textContent = '';
    return;
  }

  const now = new Date();
  let nextIdx = -1;

  journeys.forEach((journey, i) => {
    const leg0 = journey.legs[0];
    const legN = journey.legs[journey.legs.length - 1];

    const depPlan = new Date(leg0.plannedDeparture);
    const depAct  = leg0.departure ? new Date(leg0.departure) : depPlan;
    const arrPlan = new Date(legN.plannedArrival);
    const arrAct  = legN.arrival   ? new Date(legN.arrival)   : arrPlan;

    const delayMin = Math.round((depAct - depPlan) / 60000);
    const cancelled = journey.legs.some(l => l.cancelled);
    const isNext = !cancelled && nextIdx === -1 && depAct >= now;
    if (isNext) nextIdx = i;

    const durationMin = Math.round((arrPlan - depPlan) / 60000);
    const lineName = leg0.line ? leg0.line.name : (leg0.walking ? 'Fußweg' : '?');
    const product  = leg0.line ? (leg0.line.product || '') : '';
    const platform = leg0.plannedDeparturePlatform || leg0.departurePlatform || '–';
    const changes  = journey.legs.filter(l => !l.walking).length - 1;

    // Collect remarks
    const remarks = [];
    journey.legs.forEach(leg => {
      if (leg.remarks) leg.remarks.forEach(r => { if (r.text && !remarks.includes(r.text)) remarks.push(r.text); });
    });

    // Stopovers from first leg
    const stopovers = leg0.stopovers || [];

    const card = document.createElement('div');
    card.className = 'card' + (cancelled?' cancelled':'') + (isNext?' next':'');
    card.setAttribute('role','button'); card.setAttribute('tabindex','0');

    // Countdown cell
    let countHtml;
    if (cancelled) {
      countHtml = `<div class="cpast">—</div>`;
    } else {
      const ms = depAct - now;
      if (ms < 0) {
        countHtml = `<div class="cpast">abg.</div>`;
      } else if (isNext) {
        countHtml = `<div class="cval" id="${cdPrefix}_${i}">…</div><div class="clabel">noch</div>`;
      } else {
        const m = Math.floor(ms/60000);
        countHtml = m < 60
          ? `<div style="font-size:.75rem;color:var(--muted)">${m} min</div>`
          : `<div style="font-size:.7rem;color:var(--muted)">${Math.floor(m/60)}h${m%60}m</div>`;
      }
    }

    // Delay badge
    let badgeHtml;
    if (cancelled)        badgeHtml = `<span class="badge b-late">Ausfall</span>`;
    else if (delayMin<=0) badgeHtml = `<span class="badge b-ok">pünktl.</span>`;
    else if (delayMin<=5) badgeHtml = `<span class="badge b-warn">+${delayMin} min</span>`;
    else                  badgeHtml = `<span class="badge b-late">+${delayMin} min</span>`;

    // Line chip
    const chipClass = product==='suburban'?'c-s':product==='regional'?'c-rb':product==='regionalExp'?'c-re':'c-x';
    const chipHtml = lineName ? `<span class="chip ${chipClass}">${lineName}</span>` : '';

    const showOrig = delayMin > 0;
    const depClass = delayMin > 0 ? 'dep late' : 'dep';

    // Stopover HTML
    let stopsHtml = `<div class="stop-row">
      <div class="sdot org"></div>
      <span class="sname">${leg0.origin ? leg0.origin.name : fromName}</span>
      <span class="stime">${fmtTime(depPlan)}</span>
    </div>`;
    stopovers.forEach(s => {
      if (s.stop && !s.stop.name.includes(fromName.split(' ')[0]) && !s.stop.name.includes('Kindsbach') && !s.stop.name.includes('Kaiserslautern')) {
        stopsHtml += `<div class="stop-row">
          <div class="sdot"></div>
          <span class="sname">${s.stop.name}</span>
          <span class="stime">${fmtTime(new Date(s.plannedArrival||s.plannedDeparture))}</span>
        </div>`;
      }
    });
    // Add intermediate stops from all legs
    if (stopovers.length === 0 && journey.legs.length > 1) {
      journey.legs.forEach((leg,li) => {
        if (li === 0) return;
        stopsHtml += `<div class="stop-row">
          <div class="sdot"></div>
          <span class="sname">${leg.origin ? leg.origin.name : '—'}</span>
          <span class="stime">${fmtTime(new Date(leg.plannedDeparture))}</span>
        </div>`;
      });
    }
    stopsHtml += `<div class="stop-row">
      <div class="sdot dst"></div>
      <span class="sname">${legN.destination ? legN.destination.name : toName}</span>
      <span class="stime">${fmtTime(arrPlan)}</span>
    </div>`;

    const remarkHtml = remarks.length
      ? `<div class="rmk">⚠ ${remarks.slice(0,3).join(' · ')}</div>` : '';

    const operator = leg0.line && leg0.line.operator ? leg0.line.operator.name : 'DB Regio';

    card.innerHTML = `
      <div class="cmain">
        <div class="ccount">${countHtml}</div>
        <div class="cmid">
          <div class="trow">
            ${showOrig ? `<span class="orig">${fmtTime(depPlan)}</span>` : ''}
            <span class="${depClass}">${fmtTime(depAct)}</span>
            <span class="arr-t">→ ${fmtTime(arrAct)}</span>
          </div>
          <div class="brow">
            ${chipHtml}${badgeHtml}
            <span class="dur">${durationMin} min · Gl. ${platform}${changes>0?' · '+changes+' Umst.':''}</span>
          </div>
        </div>
        <div class="chev">›</div>
      </div>
      <div class="cdetail">
        <div class="det-label">Halte</div>
        ${stopsHtml}
        ${remarkHtml}
        <div class="det-op">${operator}</div>
      </div>
    `;

    card.addEventListener('click', () => card.classList.toggle('open'));
    card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') card.classList.toggle('open'); });
    el.appendChild(card);
  });

  // Live countdown for next train
  if (nextIdx >= 0) {
    const j = journeys[nextIdx];
    const leg0 = j.legs[0];
    const depAct = leg0.departure ? new Date(leg0.departure) : new Date(leg0.plannedDeparture);
    const elId = `${cdPrefix}_${nextIdx}`;
    function tickCd() {
      const cel = document.getElementById(elId);
      if (!cel) return;
      const ms = depAct - new Date();
      if (ms <= 0) { cel.textContent = 'Jetzt!'; return; }
      const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
      cel.textContent = m > 0 ? `${m}m ${s}s` : `${s}s`;
    }
    tickCd();
    const t = setInterval(tickCd,1000);
    cdTimers.push(t);

    document.getElementById(badgeId).textContent =
      'Nächste: ' + fmtTime(depAct);
  }
}

function fmtTime(d) {
  if (!d || isNaN(d)) return '–';
  return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

/* ── Auto-refresh every 60s if near "now" ────────── */
setInterval(() => {
  const v = document.getElementById('timeIn').value;
  const dt = v ? new Date(v) : new Date();
  if (Math.abs(new Date()-dt) < 5*60000) { goNow(); loadAll(); }
}, 60000);

/* ── Boot ────────────────────────────────────────── */
loadAll();
</script>
</body>
